name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unsigned:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build archive (no signing)
        working-directory: app
        run: |
          xcodebuild \
            -project CompassFriends.xcodeproj \
            -scheme CompassFriends \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/CompassFriends.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Verify app bundle
        working-directory: app
        run: |
          APP=build/CompassFriends.xcarchive/Products/Applications/CompassFriends.app
          plutil -p "$APP/Info.plist"
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          test -f "$APP/$EXEC" || { echo "::error::CFBundleExecutable '$EXEC' not found in bundle"; exit 1; }

      - name: Package unsigned IPA
        working-directory: app
        run: |
          mkdir -p build/Payload
          cp -R build/CompassFriends.xcarchive/Products/Applications/CompassFriends.app build/Payload/
          (cd build && zip -qr CompassFriends-unsigned.ipa Payload)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CompassFriends-unsigned-ipa
          path: app/build/CompassFriends-unsigned.ipa

  # Optional signed build — runs on manual dispatch when signing secrets exist:
  #   BUILD_CERT_P12_BASE64, P12_PASSWORD, PROVISIONING_PROFILE_BASE64, KEYCHAIN_PASSWORD
  signed:
    runs-on: macos-15
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate
      - name: Import certificate & profile
        env:
          BUILD_CERT_P12_BASE64: ${{ secrets.BUILD_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          [ -z "$BUILD_CERT_P12_BASE64" ] && { echo "No signing secrets — skipping."; exit 0; }
          KEYCHAIN="$RUNNER_TEMP/app.keychain-db"
          echo "$BUILD_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/pp.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/pp.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Archive & export signed IPA
        working-directory: app
        run: |
          xcodebuild -project CompassFriends.xcodeproj -scheme CompassFriends \
            -configuration Release -sdk iphoneos \
            -archivePath build/CompassFriends.xcarchive archive
          xcodebuild -exportArchive -archivePath build/CompassFriends.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export
      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: CompassFriends-signed-ipa
          path: app/build/export/*.ipa
